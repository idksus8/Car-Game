<!doctype html>  
<html lang="en">  
<head>  
<meta charset="utf-8">  
<meta name="theme-color" content="#0d1015">  
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">  
<title>Car Game by Lou</title>  
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1015'/%3E%3Cpath d='M7 22l5-12h13l-3 6h-6l-1 6z' fill='%23ff4d2e'/%3E%3C/svg%3E">  
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">  
<style>  
:root{--bg:#0d1015;--panel:rgba(13,16,21,.62);--line:rgba(255,255,255,.1);--ink:#eef1f5;--mute:#98a1b0;--acc:#ff4d2e;--f:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--b:Barlow,system-ui,-apple-system,'Segoe UI',sans-serif}  
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:var(--b);color:var(--ink)}  
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}  
#hud>*{position:fixed;pointer-events:none}  
#place,#lap,#mm,#item{background:var(--panel);border:1px solid var(--line);border-radius:6px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}  
#place:empty,#lap:empty,#spd:empty,#item:empty,body:not(.run) #mm,body:not(.run) #dbar{display:none}  
#place{left:max(14px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));padding:7px 14px 8px;display:grid;grid-template-columns:auto auto auto;align-items:baseline;column-gap:3px}  
#place .l,#lap span{font:600 11px var(--f);letter-spacing:.16em;color:var(--mute)}  
#place .l{grid-column:1/-1}  
#place b{font:italic 700 clamp(48px,8vw,72px)/.95 var(--f)}  
#place sup{font:italic 600 22px var(--f);align-self:start;padding-top:4px}  
#place em{font:500 18px var(--f);font-style:normal;color:var(--mute);margin-left:4px}  
#lap{right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));padding:8px 12px;display:grid;grid-template-columns:auto auto;gap:2px 16px;align-items:center;text-align:right}  
#lap b{font:600 24px var(--f);font-variant-numeric:tabular-nums}  
#mm{right:max(14px,env(safe-area-inset-right));top:calc(max(12px,env(safe-area-inset-top)) + 84px);width:110px;height:110px}  
#spd{left:max(16px,env(safe-area-inset-left));bottom:max(104px,calc(env(safe-area-inset-bottom) + 94px));display:flex;align-items:baseline;gap:8px;text-shadow:0 2px 14px rgba(0,0,0,.55)}  
#spd b{font:italic 700 clamp(44px,7vw,68px)/1 var(--f);font-variant-numeric:tabular-nums}  
#spd .gr{font:italic 700 28px var(--f);color:#fff;margin-left:10px;padding:0 10px;border:2px solid rgba(255,255,255,.5);border-radius:8px;letter-spacing:0}
#spd span{font:600 13px var(--f);letter-spacing:.16em;color:var(--mute)}  
#dbar{left:max(16px,env(safe-area-inset-left));bottom:max(92px,calc(env(safe-area-inset-bottom) + 82px));width:150px;height:4px;background:rgba(255,255,255,.16);border-radius:2px;overflow:hidden}  
#dbar i{display:block;height:100%;width:0;background:#c9d1dc}  
#item{right:max(14px,env(safe-area-inset-right));bottom:max(92px,calc(env(safe-area-inset-bottom) + 82px));width:68px;height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}  
#item svg{width:28px;height:28px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}  
#item small{font:600 10px var(--f);letter-spacing:.14em;color:var(--mute)}  
@media (hover:hover){#spd{bottom:48px}#dbar{bottom:36px}#item{bottom:30px}}  
#toast{left:0;right:0;top:15%;text-align:center;font:italic 700 clamp(26px,5vw,42px)/1 var(--f);letter-spacing:.08em;text-transform:uppercase;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;text-shadow:0 2px 18px rgba(0,0,0,.6)}  
#toast.on{opacity:1;transform:none}  
#warn{left:0;right:0;top:0;bottom:0;opacity:0;transition:opacity .15s}  
#warn.on{opacity:1}  
#warn .tx{position:absolute;left:0;right:0;top:30%;text-align:center;font:italic 700 clamp(22px,4vw,34px)/1 var(--f);letter-spacing:.12em;color:#ff4a2a;text-shadow:0 2px 16px rgba(0,0,0,.7);animation:wb .35s steps(2,jump-none) infinite}  
#warn .tx small{display:block;font:600 13px var(--f);letter-spacing:.3em;margin-top:5px;color:#fff}  
#warn .ar{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;animation:wb .35s steps(2,jump-none) infinite}  
#warn .ar svg{width:100%;height:100%;fill:#ff4a2a;stroke:#fff;stroke-width:1.5;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(255,60,30,.9))}  
#warn .rim{position:absolute;inset:0;box-shadow:inset 0 0 90px 10px rgba(255,40,20,.45);animation:wb .35s steps(2,jump-none) infinite}  
@keyframes wb{50%{opacity:.35}}  
#toast small{display:block;font:600 13px var(--f);letter-spacing:.3em;margin-bottom:4px}  
#item{transition:border-color .2s,box-shadow .2s}  
#msg{left:0;right:0;top:22%;text-align:center;font:italic 700 clamp(80px,18vw,180px)/1 var(--f);color:#fff;text-shadow:0 4px 40px rgba(0,0,0,.45)}  
#menu{inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:12px;padding:24px clamp(20px,7vw,120px);box-sizing:border-box;overflow:auto;background:linear-gradient(90deg,rgba(8,10,14,.94) 0,rgba(8,10,14,.82) 40%,rgba(8,10,14,.25) 75%,rgba(8,10,14,.08));pointer-events:auto!important}  
@media (max-width:700px){#menu{background:rgba(8,10,14,.92);justify-content:flex-start;padding-top:max(28px,env(safe-area-inset-top))}}  
.eyebrow{font:600 12px var(--f);letter-spacing:.24em;text-transform:uppercase;color:var(--acc)}  
#menu h1{margin:0;font:italic 700 clamp(48px,9vw,96px)/.9 var(--f);text-transform:uppercase;letter-spacing:.01em}  
#menu h1 .by{display:block;font-size:.3em;letter-spacing:.12em;margin-top:.5em;opacity:.8}  
#menu p{margin:0;max-width:400px;font-size:15px;line-height:1.55;color:var(--mute)}  
#kb{display:grid;grid-template-columns:auto 1fr;gap:7px 20px;font-size:13px;color:var(--mute);margin:6px 0 10px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);width:100%;max-width:400px}  
#kb b{color:var(--ink);font-weight:500}  
kbd{font:600 11px var(--b);padding:2px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;margin-right:3px;color:var(--ink);background:rgba(255,255,255,.04)}  
.row{display:flex;gap:10px;flex-wrap:wrap}  
#menu input{font:500 15px var(--b);padding:11px 14px;border-radius:4px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);width:150px;outline:0;-webkit-user-select:text;user-select:text}  
#menu input:focus{border-color:var(--acc)}  
#menu #code{text-transform:uppercase;letter-spacing:.3em;text-align:center;width:110px}  
#menu button{font:600 16px var(--f);letter-spacing:.1em;text-transform:uppercase;padding:11px 22px;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}  
#menu button:hover{border-color:rgba(255,255,255,.4)}  
#menu button#go{background:var(--acc);border-color:var(--acc);color:#fff}  
#menu button#go:hover{filter:brightness(1.1)}
body.reg #item,body.reg #dbar,body.reg #bi{display:none!important}
#menu button#host,#menu button#join{position:relative;overflow:visible;cursor:not-allowed;color:rgba(255,255,255,.3);border-color:rgba(255,255,255,.12)}
#menu button#host:hover,#menu button#join:hover{border-color:rgba(255,255,255,.12)}
#menu button#host::before,#menu button#host::after,#menu button#join::before,#menu button#join::after{content:'OUT OF ORDER';position:absolute;left:-10px;right:-10px;top:50%;padding:7px 0;text-align:center;white-space:nowrap;font:700 12px/1.2 var(--f);letter-spacing:.2em;color:#111;
 background:linear-gradient(#ffd400,#ffd400) center/100% calc(100% - 10px) no-repeat,repeating-linear-gradient(-45deg,#111 0 7px,#ffd400 7px 14px);box-shadow:0 2px 6px rgba(0,0,0,.5);pointer-events:none}
#menu button#host::after,#menu button#join::after{transform:translateY(-50%) rotate(-7deg)}
#menu button#host::before,#menu button#join::before{transform:translateY(-50%) rotate(6deg);filter:brightness(.92)}  
#lob{width:100%;max-width:400px}  
#lob .code{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}  
#lob .code span{font:600 12px var(--f);letter-spacing:.16em;color:var(--mute);text-transform:uppercase}  
#lob .code b{font:700 34px var(--f);letter-spacing:.2em}  
#lob .pl{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}  
#lob .pl em{font:600 11px var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}  
#touch{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:none;justify-content:space-between;padding:0 14px;box-sizing:border-box}  
#touch div{display:flex;gap:10px}  
#touch button{font:600 15px var(--f);letter-spacing:.1em;color:var(--ink);background:rgba(13,16,21,.55);border:1px solid var(--line);border-radius:8px;width:72px;height:60px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}  
#touch button.w{width:96px}  
#touch button:active{background:var(--acc);border-color:var(--acc)}  
@media (hover:none){#touch{display:flex}}  
#vig,#fx,#zapf{position:fixed;inset:0;pointer-events:none}  
#zapf{opacity:0;background:radial-gradient(ellipse at center,rgba(255,255,255,.96) 0,rgba(176,218,255,.9) 100%)}  
#vig{background:radial-gradient(ellipse at center,transparent 62%,rgba(6,8,12,.35) 100%)}  
#fx{background:radial-gradient(ellipse at center,transparent 50%,rgba(255,150,70,.35) 100%);opacity:0;transition:opacity .12s}  
#draw{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);z-index:5}  
#draw header{display:flex;justify-content:space-between;align-items:flex-end;gap:8px 24px;flex-wrap:wrap;padding:max(18px,env(safe-area-inset-top)) clamp(16px,4vw,40px) 10px}  
#draw h2{margin:2px 0 0;font:italic 700 clamp(30px,5vw,46px)/1 var(--f);text-transform:uppercase}  
#dmsg{font-size:14px;color:var(--mute);max-width:420px;line-height:1.45}  
#dmsg.err{color:#ff7a66}  
#dc{flex:1;min-height:0;width:100%;touch-action:none;cursor:crosshair}  
#draw .row{padding:12px clamp(16px,4vw,40px) max(16px,env(safe-area-inset-bottom))}  
#draw button{font:600 16px var(--f);letter-spacing:.1em;text-transform:uppercase;padding:11px 22px;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}  
#draw button:hover:not(:disabled){border-color:rgba(255,255,255,.4)}  
#draw button#dgo{background:var(--acc);border-color:var(--acc);color:#fff;margin-left:auto}  
#draw button:disabled{opacity:.35;cursor:default}  
#stw{display:flex;flex-direction:column;gap:10px;align-items:flex-start;width:100%;max-width:400px}
#sp{display:flex;flex-direction:column;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.04);width:100%;box-sizing:border-box}
#sp[hidden]{display:none}
#sp .sr{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap}
#sp .sr>span{font:600 12px var(--f);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
#sw{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#menu #sp button.sw{width:26px;height:26px;padding:0;border-radius:50%;border:2px solid transparent;background:var(--c)}
#menu #sp button.sw.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
#menu #sp input#cc{width:34px;height:30px;padding:0;border:none;background:none;cursor:pointer}
#sp .seg{display:flex}
#menu #sp .seg button{padding:7px 14px;font-size:14px;border-radius:0}
#menu #sp .seg button:first-child{border-radius:4px 0 0 4px}
#menu #sp .seg button:last-child{border-radius:0 4px 4px 0;border-left:none}
#menu #sp .seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#upg{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));background:rgba(6,8,12,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#upg[hidden]{display:none}
#upg .card{width:100%;max-width:560px;max-height:100%;display:flex;flex-direction:column;background:#141821;border:1px solid var(--line);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden}
#upg header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
#upg h2{margin:2px 0 0;font:italic 700 clamp(28px,5vw,38px)/1 var(--f);text-transform:uppercase}
#upg .vt{font:600 12px var(--f);letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
#upg .sub{margin:12px 0 0;font-size:13px;line-height:1.5;color:var(--mute)}
#upg .body{overflow:auto;padding:0 20px 8px;-webkit-overflow-scrolling:touch}
#upg h3{margin:18px 0 6px;font:600 13px var(--f);letter-spacing:.2em;text-transform:uppercase;color:var(--g)}
#upg ul{margin:0;padding:0;list-style:none}
#upg li{position:relative;padding:7px 0 7px 18px;font-size:14px;line-height:1.45;color:#d6dbe3;border-bottom:1px solid rgba(255,255,255,.05)}
#upg li::before{content:'';position:absolute;left:2px;top:14px;width:6px;height:6px;border-radius:50%;background:var(--g)}
#upg li b{color:var(--ink);font-weight:600}
#upg footer{padding:12px 20px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;justify-content:flex-end}
#upg button{font:600 16px var(--f);letter-spacing:.1em;text-transform:uppercase;padding:9px 20px;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
#upg #uc2{background:var(--acc);border-color:var(--acc)}
#upg #uc{padding:2px 11px 5px;font-size:24px;line-height:1}
#nb{display:inline-block;width:8px;height:8px;margin-left:9px;border-radius:50%;background:var(--acc);vertical-align:middle}
#nb[hidden]{display:none}
</style>  
</head>  
<body>  
<canvas id="gl" role="img" aria-label="Car Game race view"></canvas>  
<div id="vig"></div><div id="fx"></div><div id="zapf"></div>  
<div id="hud">  
  <div id="place"></div><div id="lap"></div><canvas id="mm" width="110" height="110"></canvas>  
  <div id="spd"></div><div id="item"></div><div id="dbar"><i></i></div><div id="warn"><div class="rim"></div><div class="tx">ROCKET INCOMING<small></small></div><div class="ar"><svg viewBox="0 0 24 24"><path d="M12 2l9 19-9-5-9 5z"/></svg></div></div><div id="toast" aria-live="polite"></div><div id="msg" aria-live="polite"></div>  
  <div id="menu"><div class="eyebrow">Circuit Grand Prix · 3 laps</div><h1>Car Game <small class="by">by Lou</small></h1>  
    <p id="mp">Draw your own circuit before every solo race, or race up to five friends online.</p>  
    <div id="kb"><b>Steer</b><span><kbd>←</kbd><kbd>→</kbd> or <kbd>A</kbd><kbd>D</kbd></span><b>Throttle / brake</b><span><kbd>↑</kbd><kbd>↓</kbd> or <kbd>W</kbd><kbd>S</kbd></span><b>Drift</b><span><kbd>Shift</kbd> or <kbd>Z</kbd></span><b>Use item</b><span><kbd>Space</kbd> or <kbd>X</kbd></span><b>Look back</b><span>Hold <kbd>Ctrl</kbd></span></div>  
    <input id="nm" maxlength="10" placeholder="Driver name" autocomplete="off">  
    <div class="row"><button id="go" type="button">Solo race</button><button id="reg" type="button" title="Standard circuit, plain racing: no items, boost pads or drift boosts">Regular mode</button><button id="host" type="button" disabled aria-label="Host online (out of order)">Host online</button></div>
    <div id="stw"><div class="row"><button id="set" type="button" aria-expanded="false" aria-controls="sp">Settings</button><button id="upd" type="button">What’s new<span id="nb" hidden></span></button></div><div id="sp" hidden><div class="sr"><span>Car color</span><div id="sw"></div><input id="cc" type="color" value="#ff0500" aria-label="Pick any car color"></div><div class="sr"><span>Units</span><div class="seg"><button id="uM" type="button">Metric</button><button id="uI" type="button">Imperial</button></div></div></div></div>  
    <div class="row" id="jr"><input id="code" maxlength="4" placeholder="CODE" autocomplete="off"><button id="join" type="button" disabled aria-label="Join room (out of order)">Join room</button></div>  
    <div id="lob"></div><button id="leave" type="button" style="display:none">Leave room</button></div>  
</div>  
<div id="draw"><header><div><div class="eyebrow" id="dr">Round 1</div><h2>Draw your circuit</h2></div><div id="dmsg"></div></header>  
<canvas id="dc"></canvas>  
<div class="row"><button id="dclear" type="button">Clear</button><button id="drand" type="button">Random track</button><button id="dback" type="button">Back</button><button id="dgo" type="button" disabled>Race this track</button></div></div>  
<div id="upg" role="dialog" aria-modal="true" aria-labelledby="ut" hidden><div class="card"><header><div><div class="vt" id="uv"></div><h2 id="ut">What’s new</h2></div><button id="uc" type="button" aria-label="Close">×</button></header><div class="body" id="ub"></div><footer><button id="uc2" type="button">Got it</button></footer></div></div>
<div id="touch"><div><button id="bl" type="button" aria-label="Steer left">◀</button><button id="br" type="button" aria-label="Steer right">▶</button></div><div><button id="bd" type="button" class="w">DRIFT</button><button id="bi" type="button" class="w">ITEM</button></div></div>  
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>  
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>  
<script>  
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));  
const HW=14,N=600,MAXV=95,LAPS=3;
const newSeed=()=>Math.random()*4294967296>>>0;
let REG=false;   // regular mode: plain racing, no item boxes, items, boost pads, drift boosts or catch-up AI  
// ---------- renderer / scene  
const renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true,powerPreference:'high-performance'});  
const MOBILE=matchMedia('(hover:none)').matches;  
renderer.setPixelRatio(Math.min(devicePixelRatio,MOBILE?1.5:2));  
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;  
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;  
const maxA=Math.min(8,renderer.capabilities.getMaxAnisotropy());  
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0xcfe6f5,200,950);  
const cam=new THREE.PerspectiveCamera(70,1,.9,2600);  
function resize(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}  
addEventListener('resize',resize);resize();  
// sky dome with sun glow  
const SUN=new THREE.Vector3(.55,.5,.35).normalize();  
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:{sun:{value:SUN}},  
  vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',  
  fragmentShader:`varying vec3 vP;uniform vec3 sun;void main(){vec3 d=normalize(vP);float h=clamp(d.y,0.,1.);  
    vec3 top=vec3(.14,.40,.86),mid=vec3(.44,.71,.96),hor=vec3(.81,.90,.96);  
    vec3 c=mix(hor,mid,smoothstep(0.,.22,h));c=mix(c,top,smoothstep(.18,.75,h));  
    float s=max(dot(d,sun),0.);c+=vec3(1.,.82,.5)*pow(s,6.)*.32+vec3(1.,.95,.8)*pow(s,500.)*2.5;  
    if(d.y<0.)c=hor;gl_FragColor=vec4(c,1.);}`});  
const sky=new THREE.Mesh(new THREE.SphereGeometry(1800,32,16),skyMat);sky.renderOrder=-1;sky.frustumCulled=false;scene.add(sky);  
try{const pm=new THREE.PMREMGenerator(renderer),es=new THREE.Scene();es.add(new THREE.Mesh(new THREE.SphereGeometry(50,32,16),skyMat));scene.environment=pm.fromScene(es,.02).texture;pm.dispose()}catch(e){}  
// lights + soft shadows that follow the player  
scene.add(new THREE.HemisphereLight(0xcfe8ff,0x4a7a40,.6));  
const sun=new THREE.DirectionalLight(0xfff0cc,1.25);sun.castShadow=true;  
sun.shadow.mapSize.set(MOBILE?1024:2048,MOBILE?1024:2048);  
{const s=sun.shadow.camera;s.left=s.bottom=-70;s.right=s.top=70;s.near=10;s.far=420;s.updateProjectionMatrix()}

  // camera  
  let dh=me.h-ch;dh=Math.atan2(Math.sin(dh),Math.cos(dh));ch+=dh*(1-Math.exp(-5*dt));  
  lbk+=((keys.ControlLeft||keys.ControlRight?1:0)-lbk)*(1-Math.exp(-11*dt));const ca=ch+Math.PI*lbk;   // Ctrl swings the camera round to look behind  
  const tx=me.x-Math.sin(ca)*14,tz=me.z-Math.cos(ca)*14,k=state==='count'?1:1-Math.exp(-9*dt);  
  cam.position.x+=(tx-cam.position.x)*k;cam.position.y+=(6.8+me.y-cam.position.y)*k;cam.position.z+=(tz-cam.position.z)*k;  
  if(zapShake>0){cam.position.x+=(Math.random()-.5)*zapShake*1.4;cam.position.y+=(Math.random()-.5)*zapShake*.9;cam.position.z+=(Math.random()-.5)*zapShake*1.4}  
  cam.lookAt(me.x+Math.sin(ca)*12,2.2+me.y,me.z+Math.cos(ca)*12);  
  sun.position.set(me.x+SUN.x*160,me.y+SUN.y*160,me.z+SUN.z*160);sun.target.position.set(me.x,me.y,me.z);sky.position.copy(cam.position);  
  $('fx').style.opacity=String(me.boost>0?.8:clamp((me.v/MAXV-.85)*3,0,.3));  
  const fov=68+me.v/MAXV*8+(me.boost>0?10:0);cam.fov+=(fov-cam.fov)*Math.min(1,dt*5);cam.updateProjectionMatrix();  
  for(const k in pressed)delete pressed[k];T.itemP=false;  
}  
// ---------- HUD  
const put=(id,h)=>{const e=$(id);if(e._h!==h){e._h=h;e.innerHTML=h}};  
const ord=n=>n+(['th','st','nd','rd'][n]||'th'),fmt=t=>Math.floor(t/60)+':'+(t%60).toFixed(1).padStart(4,'0');  
const mm=/** @type {HTMLCanvasElement} */($('mm')).getContext('2d');  
let mmB=null;  
function calcMM(){let a=1e9,b=-1e9,c=1e9,d=-1e9;pts.forEach(p=>{a=Math.min(a,p.x);b=Math.max(b,p.x);c=Math.min(c,p.z);d=Math.max(d,p.z)});mmB={x:a,z:c,s:96/Math.max(b-a,d-c)}}  
const mx=x=>7+(x-mmB.x)*mmB.s,mz=z=>7+(z-mmB.z)*mmB.s;  
function hud(){  
  if(state==='ready')return;  
  const pl=me.finished?place:rankOf(me);put('place','<span class="l">POSITION</span><b>'+pl+'</b><sup>'+ord(pl).slice(String(pl).length)+'</sup><em>/'+R.length+'</em>');  
  put('lap','<span>LAP</span><b>'+clamp(me.lap+1,1,LAPS)+'/'+LAPS+'</b><span>TIME</span><b>'+fmt(me.finished?finT:raceT)+'</b>');  
  put('spd','<b>'+Math.round(me.v*U().s)+'</b><span>'+U().sl+'</span><span class="gr">'+(me.v<.5?'N':me.gr)+'</span><span>'+Math.round(4000+Math.min(1,me.rpm)*11000)+' RPM</span>');  
  {let w=null,wd=1e9;if(state==='race'&&!me.finished)for(const q of rockets){if(q.tg!==me.id||q.own===me.id)continue;const d=Math.hypot(q.x-me.x,q.z-me.z);if(d<wd){wd=d;w=q}}  
    const el=$('warn');el.classList.toggle('on',!!w);  
    if(w){el.querySelector('small').textContent=Math.round(wd*U().d)+U().dl+(me.shield>0?' · SHIELDED':'');  
      let a=Math.atan2(w.x-me.x,w.z-me.z)-me.h;a=Math.atan2(Math.sin(a),Math.cos(a));   // bearing relative to where you face (0 = dead ahead)  
      const R2=Math.min(innerWidth,innerHeight)*.36;el.querySelector('.ar').style.transform='translate('+(Math.sin(a)*R2).toFixed(0)+'px,'+(-Math.cos(a)*R2).toFixed(0)+'px) rotate('+(a*180/Math.PI).toFixed(0)+'deg)'}}  
  {const it=ITEMS[me.item],rc=it?RAR[RARITY[me.item]].c:'',el=$('item');  
    put('item',it?'<svg viewBox="0 0 24 24" style="stroke:'+rc+'">'+it[0]+'</svg><small style="color:'+rc+'">'+it[1]+'</small>':'<small>ITEM</small>');  
    el.style.borderColor=it?rc:'';el.style.boxShadow=it&&RARITY[me.item]!=='common'?'0 0 18px '+rc+'66':''}  
  const f=Math.min(1,me.charge/1.8),db=$('dbar').querySelector('i');db.style.width=f*100+'%';db.style.background=me.charge>1.8?'#ff6a2b':me.charge>.9?'#4aa8ff':'#c9d1dc';  
  mm.clearRect(0,0,110,110);mm.strokeStyle='#ffffff55';mm.lineWidth=4;mm.lineJoin='round';mm.beginPath();  
  for(let i=0;i<=N;i+=6){const p=pts[i%N];i?mm.lineTo(mx(p.x),mz(p.z)):mm.moveTo(mx(p.x),mz(p.z))}mm.closePath();mm.stroke();
  mm.strokeStyle='#ffd23f';mm.lineWidth=5;mm.beginPath();for(let i=0;i<N;i+=3){const j=(i+3)%N;if(YC[i]>2&&YC[j]>2){mm.moveTo(mx(pts[i].x),mz(pts[i].z));mm.lineTo(mx(pts[j].x),mz(pts[j].z))}}mm.stroke();mm.lineWidth=4;  
  R.forEach(r=>{mm.fillStyle=r.isMe?(cfg.col||'#ff5a36'):'#'+r.col.toString(16).padStart(6,'0');mm.beginPath();mm.arc(mx(r.x),mz(r.z),r.isMe?4.5:3,0,7);mm.fill()});  
}  
function showEnd(){  
  $('menu').querySelector('h1').textContent=place===1?'Victory':'Finished '+ord(place);  
  $('mp').textContent='Race time '+fmt(finT)+'.';$('go').textContent=MP?'Race again':'Draw new track';$('menu').style.display='flex';endUI();  
}  
// ---------- settings: car color + units, remembered on this device
const COLS=['#ff0500','#ff8a1f','#ffd23f','#2ec4b6','#4cc9f0','#3a6bff','#b388ff','#ff5fa2','#f2f2f2','#2b2f3a'],cfg={};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('clou-cfg')||'{}'))}catch(e){}
const saveCfg=()=>{try{localStorage.setItem('clou-cfg',JSON.stringify(cfg))}catch(e){}};
const U=()=>cfg.unit==='imperial'?{s:2.23694,sl:'MPH',d:3.28084,dl:' ft'}:{s:3.6,sl:'KM/H',d:1,dl:' m'};
function applyCfg(){
  const cur=(cfg.col||COLS[0]).toLowerCase();
  if(cfg.col)for(const n in BODY){const m=me.mats[n];if(m)m.color.set(cfg.col).multiplyScalar(BODY[n])}   // paint the body panels, keep glass/tyres/trim
  $('cc').value=cur;
  const w=$('sw');w.innerHTML='';
  COLS.forEach(h=>{const b=document.createElement('button');b.type='button';b.className='sw'+(cur===h?' on':'');b.style.setProperty('--c',h);b.setAttribute('aria-label','Car color '+h);
    b.addEventListener('click',()=>{cfg.col=h;saveCfg();applyCfg()});w.appendChild(b)});
  $('uM').classList.toggle('on',cfg.unit!=='imperial');$('uI').classList.toggle('on',cfg.unit==='imperial');
}
$('set').addEventListener('click',()=>{const o=$('sp');o.hidden=!o.hidden;$('set').setAttribute('aria-expanded',String(!o.hidden))});
$('cc').addEventListener('input',e=>{cfg.col=e.target.value;saveCfg();applyCfg()});
$('uM').addEventListener('click',()=>{cfg.unit='metric';saveCfg();applyCfg()});
$('uI').addEventListener('click',()=>{cfg.unit='imperial';saveCfg();applyCfg()});
applyCfg();

 ['Fixed','#ffd23f',[

 ['Heads up','#ff7a66',[
  '<b>Online hosting is off for now.</b> The button says out of order. It was on in the last version.']]]};
const upg=$('upg');let upgFrom=null;
function buildUpd(){$('uv').textContent='Version '+UPD.ver+' · '+UPD.date;
  $('ub').innerHTML='<p class="sub">'+UPD.sub+'</p>'+UPD.groups.map(g=>'<h3 style="--g:'+g[1]+'">'+g[0]+'</h3><ul style="--g:'+g[1]+'">'+g[2].map(t=>'<li>'+t+'</li>').join('')+'</ul>').join('')}
function openUpd(){buildUpd();upgFrom=document.activeElement;upg.hidden=false;$('ub').scrollTop=0;$('uc2').focus()}
function closeUpd(){upg.hidden=true;cfg.seen=UPD.ver;saveCfg();$('nb').hidden=true;if(upgFrom&&upgFrom.focus)upgFrom.focus()}
$('upd').addEventListener('click',openUpd);$('uc').addEventListener('click',closeUpd);$('uc2').addEventListener('click',closeUpd);
upg.addEventListener('click',e=>{if(e.target===upg)closeUpd()});
addEventListener('keydown',e=>{if(!upg.hidden&&e.code==='Escape'){e.preventDefault();closeUpd()}});
if(cfg.seen!==UPD.ver){$('nb').hidden=false;setTimeout(openUpd,500)}
let paused=false;
const togglePause=f=>{if(MP||!(state==='race'||state==='count'))return;paused=f===undefined?!paused:f;$('msg').textContent=paused?'PAUSED':''};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='KeyP'||e.code==='Escape')togglePause()});
addEventListener('blur',()=>togglePause(true));
let last=performance.now();  
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(!paused)update(dt);hud();renderer.render(scene,cam);requestAnimationFrame(loop)}  
buildTrack(CP,newSeed());reset();cam.position.set(me.x-Math.sin(me.h)*14,6.8,me.z-Math.cos(me.h)*14);  
let looping=false;const kick=()=>{if(!looping){looping=true;requestAnimationFrame(loop)}};  
setTimeout(kick,1500);  
Promise.resolve(document.fonts&&document.fonts.load?document.fonts.load('600 20px "Barlow Condensed"'):null).catch(()=>{}).then(kick);  
</script>
